name: job-radar

on:
  schedule:
    - cron: '0 */2 * * *'   # mỗi 2 giờ (GitHub bóp cron dày nên 10 phút vô nghĩa; 2h là hợp lý)
  workflow_dispatch:
    inputs:
      force_test:
        description: 'Tạo issue test dù không có job mới (kiểm tra email)'
        type: boolean
        default: false

permissions:
  contents: write   # commit seen.json
  issues: write     # tạo issue digest -> GitHub tự gửi email

concurrency:
  group: job-radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch + filter jobs
        id: fetch
        run: node radar.js
        env:
          FORCE_TEST: ${{ github.event.inputs.force_test }}

      - name: Mở issue digest (GitHub gửi email cho bạn)
        if: steps.fetch.outputs.count != '0' || github.event.inputs.force_test == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const owner = context.repo.owner, repo = context.repo.repo;
            // Đóng hết issue radar cũ trước -> chỉ giữ đúng 1 issue mới nhất (khỏi ngập)
            const olds = await github.rest.issues.listForRepo({ owner, repo, state: 'open', per_page: 100 });
            for (const it of olds.data) {
              if (it.pull_request) continue;
              await github.rest.issues.update({ owner, repo, issue_number: it.number, state: 'closed' });
            }
            // @mention + assign owner => GitHub CHẮC CHẮN gửi email
            const body = `@${owner}\n\n` + fs.readFileSync('digest.md', 'utf8');
            const when = new Date().toISOString().slice(0, 16).replace('T', ' ') + ' UTC';
            await github.rest.issues.create({
              owner,
              repo,
              title: `Job Radar ${when} — ${{ steps.fetch.outputs.count }} job mới`,
              body,
              assignees: [owner],
            });

      - name: Lưu trạng thái đã xem
        run: |
          git config user.name "job-radar[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seen.json
          git commit -m "chore: update seen state [skip ci]" || echo "no change"
          git push || echo "nothing to push"
